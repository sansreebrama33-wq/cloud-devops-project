name: Docker Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  docker-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t sree2627/cloud-devops-project:latest .

      - name: Push Docker image
        run: docker push sree2627/cloud-devops-project:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test AWS SSM connection
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-085973740a8e2d864" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo SSM connection successful"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-085973740a8e2d864"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull sree2627/cloud-devops-project:latest
            sudo docker stop cloud-devops-app || true
            sudo docker rm cloud-devops-app || true
            sudo docker run -d -p 80:80 --name cloud-devops-app sree2627/cloud-devops-project:latest