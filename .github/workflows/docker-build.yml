name: Docker Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  docker-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t sree2627/cloud-devops-project:latest .

      - name: Push Docker image
        run: docker push sree2627/cloud-devops-project:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::148996982198:role/GitHubActions-SSM-Deploy
          aws-region: us-east-1

      - name: Deploy to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-085973740a8e2d864" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull sree2627/cloud-devops-project:latest",
              "docker stop cloud-devops-app || true",
              "docker rm cloud-devops-app || true",
              "docker run -d --name cloud-devops-app -p 80:80 --restart unless-stopped sree2627/cloud-devops-project:latest",
              "docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          for i in {1..12}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-085973740a8e2d864" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-085973740a8e2d864" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-085973740a8e2d864" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
