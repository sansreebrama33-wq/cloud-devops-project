name: Docker Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t sree2627/cloud-devops-project:latest .

      - name: Push Docker image
        run: docker push sree2627/cloud-devops-project:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull sree2627/cloud-devops-project:latest
            sudo docker stop cloud-devops-app || true
            sudo docker rm cloud-devops-app || true
            sudo docker run -d -p 80:80 --name cloud-devops-app sree2627/cloud-devops-project:latest
            