name: Docker Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  docker-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t sree2627/cloud-devops-project:latest .

      - name: Push Docker image
        run: docker push sree2627/cloud-devops-project:latest

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          python - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC sub:")
          print(claims.get("sub"))
          print()
          print("OIDC aud:")
          print(claims.get("aud"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::148996982198:role/GitHubActions-SSM-Deploy
          aws-region: us-east-1

      - name: Test AWS SSM connection
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-085973740a8e2d864" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo SSM connection successful"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-085973740a8e2d864"
